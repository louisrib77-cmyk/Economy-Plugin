# Das Geld liegt im JobsPlugin - /pay, /balance usw. arbeiten mit demselben Geld.
currency-symbol: "$"
min-pay: 0.01          # kleinster Betrag bei /pay
baltop-page-size: 10

# MiniMessage-Format. Platzhalter stehen in spitzen Klammern.
messages:
  prefix: "<gray>[<gold>Wirtschaft<gray>] "
  no-permission: "<red>Dafür hast du keine Rechte."
  only-players: "<red>Das geht nur als Spieler."
  jobs-missing: "<red>Das JobsPlugin ist nicht verfügbar."
  no-player: "<red>Spieler <white><player><red> wurde nicht gefunden."
  invalid-amount: "<red>Ungültiger Betrag. Beispiel: <white>/pay Name 100"
  min-amount: "<red>Der Mindestbetrag ist <white><min><red>."
  self-pay: "<red>Du kannst dir nicht selbst Geld senden."
  not-enough: "<red>Du hast nicht genug Geld. Dein Kontostand: <white><money>"
  pay-usage: "<red>Benutzung: <white>/pay <Spieler> <Betrag>"
  pay-sent: "<gray>Du hast <gold><money><gray> an <white><player><gray> gesendet."
  pay-received: "<gray>Du hast <gold><money><gray> von <white><player><gray> erhalten."
  balance-self: "<gray>Dein Kontostand: <gold><money>"
  balance-other: "<gray>Kontostand von <white><player><gray>: <gold><money>"
  baltop-header: "<gold><bold>Reichste Spieler <gray>(Seite <page>/<pages>)"
  baltop-line: "<yellow><rank>. <white><player><gray> - <gold><money>"
  baltop-empty: "<gray>Es gibt noch keine Einträge."
  eco-usage: "<red>Benutzung: <white>/eco <give|take|set> <Spieler> <Betrag>"
  eco-done: "<gray>Neuer Kontostand von <white><player><gray>: <gold><money>"
